<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tastatur 2.0</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">AI</span>
        <div>
          <h1>AI Tastatur 2.0</h1>
          <p class="subtitle">Tippe so schnell wie du sprichst</p>
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="wordsAccepted">0</span>
        <span class="stat-label">Wörter gespart</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="timeSaved">0s</span>
        <span class="stat-label">Zeit gespart</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="accuracy">-</span>
        <span class="stat-label">Trefferquote</span>
      </div>
    </section>

    <section class="settings-group">
      <h2>Cloud AI</h2>
      <div class="setting">
        <label class="toggle-row">
          <span>Claude API aktivieren</span>
          <label class="toggle small">
            <input type="checkbox" id="cloudEnabled" checked>
            <span class="slider"></span>
          </label>
        </label>
      </div>
      <div class="setting">
        <label for="apiKey">API Key</label>
        <div class="input-row">
          <input type="password" id="apiKey" placeholder="sk-ant-...">
          <button id="toggleApiKey" class="icon-btn" title="Anzeigen/Verbergen">
            <span class="eye-icon">&#128065;</span>
          </button>
        </div>
      </div>
    </section>

    <section class="settings-group">
      <h2>Verhalten</h2>
      <div class="setting">
        <label for="language">Sprache</label>
        <select id="language">
          <option value="auto">Automatisch</option>
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="setting">
        <label for="cloudDelay">Cloud Verzögerung</label>
        <div class="range-row">
          <input type="range" id="cloudDelay" min="200" max="1000" step="50" value="400">
          <span id="cloudDelayValue">400ms</span>
        </div>
      </div>
    </section>

    <section class="shortcuts">
      <h2>Tastenkürzel</h2>
      <div class="shortcut"><kbd>Tab</kbd> Vorschlag annehmen</div>
      <div class="shortcut"><kbd>→</kbd> Wort für Wort</div>
      <div class="shortcut"><kbd>↓</kbd> Nächster Vorschlag</div>
      <div class="shortcut"><kbd>Esc</kbd> Verwerfen</div>
    </section>

    <footer>
      <button id="resetData" class="link-btn">Lerndaten zurücksetzen</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
